[workspace]
resolver = "2"
members = ["crates/steam", "crates/update", "app"]

[workspace.package]
edition = "2021"
version = "1.0.0"
license = "Proprietary"

[workspace.dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[profile.release]
lto = "thin"
codegen-units = 1
